name: Notify Discord when CI fails

# Trusted metadata only: no checkout, artifacts or GitHub permissions.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci, beads-contract]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Metadata only: never check out code or download artifacts from the failed run.
      - name: Post failed run to Discord
        env:
          DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          def main():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                  event = json.load(source)
              run = event["workflow_run"]
              if run["conclusion"] != "failure":
                  return 0
              repository = "snarkipus/opencode-beads"
              if event["repository"]["full_name"] != repository or run["name"] not in ("ci", "beads-contract"):
                  raise SystemExit("Unexpected repository or workflow; notification refused.")
              webhook = os.environ.get("DISCORD_CI_WEBHOOK_URL", "")
              parsed = urllib.parse.urlsplit(webhook)
              if (parsed.scheme != "https" or parsed.netloc != "discord.com"
                      or not parsed.path.startswith("/api/webhooks/") or parsed.query or parsed.fragment):
                  raise SystemExit("Set DISCORD_CI_WEBHOOK_URL to this channel's standard Discord webhook URL.")
              branch = " ".join(str(run.get("head_branch", "unknown")).split())[:180]
              link = f"https://github.com/{repository}/actions/runs/{int(run['id'])}"
              payload = {"content": f"CI failed: {repository} / {run['name']}\nBranch: {branch}\n{link}",
                         "allowed_mentions": {"parse": []}}
              request = urllib.request.Request(webhook + "?wait=true",
                  data=json.dumps(payload).encode("utf-8"), method="POST",
                  headers={"Content-Type": "application/json",
                           "User-Agent": "OpenCode-Beads-CI-Notifier/1.0"})
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=10) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Discord notification failed: HTTP {error.code}.") from None
              except Exception:
                  raise SystemExit("Discord delivery failed or timed out; delivery may be uncertain. No retry was made.") from None
              message_id = result.get("id", "")
              if not isinstance(message_id, str) or not message_id.isdigit():
                  raise SystemExit("Discord response did not confirm a message ID.")
              print(f"Discord accepted message ID {message_id}.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
