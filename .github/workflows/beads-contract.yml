name: beads-contract

# Project-owned guidance contains attributed excerpts; no upstream executable or sync-managed vendor tree is shipped. This checks the latest stable bd release against the
# plugin's contract daily, and fails when a newer release has not been reviewed yet.
# Independent MAIN source comparison is informational; unavailable evidence fails only its job.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Beads release to check, e.g. 1.3.1 (default latest stable)
        required: false
      opencode_version:
        description: OpenCode release tag to check, e.g. v2.2.7 (default newest stable V2+)
        required: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Beads release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            version="$REQUESTED"
          else
            version="$(gh release view --repo gastownhall/beads --json tagName --jq .tagName)"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Install bd
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./scripts/install-bd.sh "$VERSION" "$RUNNER_TEMP/bd"
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"

      - name: Check bd contract
        run: bun run test:bd-contract

      - name: Require review of new Beads releases
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          validated="$(jq -r .beads.validated package.json)"
          newest="$(printf '%s\n%s\n' "$validated" "$VERSION" | sort -V | tail -n 1)"
          if [[ "$VERSION" != "$validated" && "$newest" == "$VERSION" ]]; then
            echo "::error::Beads $VERSION passes the contract but is newer than the validated $validated. Review its upgrade notes against docs/beads-artifact-policy.md, then update beads.validated in package.json and the README compatibility table."
            exit 1
          fi

  opencode-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Resolve stable OpenCode release
        id: opencode-release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.opencode_version }}
        run: |
          if [[ -z "$REQUESTED" ]]; then
            # GraphQL, not the shell, expands $endCursor.
            # shellcheck disable=SC2016
            gh api graphql --paginate --slurp -f query='
              query($endCursor: String) {
                repository(owner: "anomalyco", name: "opencode") {
                  releases(first: 100, after: $endCursor) {
                    nodes { tagName isDraft isPrerelease }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }' > "$RUNNER_TEMP/opencode-releases.json"
            REQUESTED="$(jq -er '[.[].data.repository.releases.nodes[]
              | select(.isDraft == false and .isPrerelease == false)
              | select(.tagName | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | select((.tagName | ltrimstr("v") | split(".")[0] | tonumber) >= 2)]
              | max_by(.tagName | ltrimstr("v") | split(".") | map(tonumber))
              | .tagName // empty' "$RUNNER_TEMP/opencode-releases.json")"
          fi
          gh release view "$REQUESTED" --repo anomalyco/opencode --json tagName,isDraft,isPrerelease,url > "$RUNNER_TEMP/opencode-release.json"
          jq -e '.isDraft == false and .isPrerelease == false' "$RUNNER_TEMP/opencode-release.json" > /dev/null
          tag="$(jq -er .tagName "$RUNNER_TEMP/opencode-release.json")"
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          [[ "${version%%.*}" -ge 2 ]]
          reviewed="$(cat .github/opencode-reviewed-version)"
          [[ "$reviewed" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\nreviewed=%s\n' "$version" "$reviewed" >> "$GITHUB_OUTPUT"
          {
            printf '## OpenCode stable-release monitor\n\n'
            jq -r '"Release: [\(.tagName)](\(.url))"' "$RUNNER_TEMP/opencode-release.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check exact published OpenCode SDK in a disposable snapshot
        id: sdk-check
        env:
          VERSION: ${{ steps.opencode-release.outputs.version }}
        run: |
          probe="$(mktemp -d "$RUNNER_TEMP/opencode-sdk.XXXXXX")"
          trap 'rm -rf "$probe"' EXIT
          mkdir "$probe/source" "$probe/cache"
          git archive HEAD | tar -x -C "$probe/source"
          jq --arg version "$VERSION" '.devDependencies["@opencode/plugin"] = $version' package.json > "$probe/source/package.json"
          (
            cd "$probe/source"
            export BUN_INSTALL_CACHE_DIR="$probe/cache"
            bun install --ignore-scripts
            cp "$GITHUB_WORKSPACE/package.json" package.json
            cp "$GITHUB_WORKSPACE/bun.lock" bun.lock
            [[ "$(jq -r .version node_modules/@opencode/plugin/package.json)" == "$VERSION" ]]
            bun test
            bun run typecheck
            bun run test:package
          )

      - name: Report SDK outcome and require review of new OpenCode releases
        if: ${{ always() && steps.opencode-release.outcome == 'success' }}
        env:
          VERSION: ${{ steps.opencode-release.outputs.version }}
          REVIEWED: ${{ steps.opencode-release.outputs.reviewed }}
          SDK_OUTCOME: ${{ steps.sdk-check.outcome }}
        run: |
          {
            printf '\nReviewed release: %s\n\nSDK checks: %s\n\n' "$REVIEWED" "$SDK_OUTCOME"
            printf 'These are source/SDK checks, not live-host/model qualification. No consumer upgrade or automatic baseline change occurs.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          newest="$(printf '%s\n%s\n' "$REVIEWED" "$VERSION" | sort -V | tail -n 1)"
          if [[ "$VERSION" != "$REVIEWED" && "$newest" == "$VERSION" ]]; then
            printf '\nOpenCode %s requires human review. See docs/opencode-sdk-contract.md#release-monitoring.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::OpenCode $VERSION is newer than reviewed $REVIEWED. SDK success is not release review; inspect the release before deliberately updating .github/opencode-reviewed-version."
            exit 1
          fi

  source-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Compare upstream MAIN sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          bun scripts/check-beads-integration.ts > "$RUNNER_TEMP/beads-source.json" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/beads-source.exit"
          exit "$status"

      - name: Summarize upstream MAIN comparison
        if: ${{ always() }}
        run: |
          {
            printf '## Upstream MAIN source comparison\n\n'
            printf 'Development-source information only; tagged CLI compatibility is independent.\n\n'
            if [[ -f "$RUNNER_TEMP/beads-source.exit" ]]; then
              printf 'Collector exit status: %s\n\n' "$(cat "$RUNNER_TEMP/beads-source.exit")"
            else
              printf 'Comparison unavailable: collector did not finish.\n\n'
            fi
            if [[ -s "$RUNNER_TEMP/beads-source.json" ]]; then
              printf '````json\n'
              cat "$RUNNER_TEMP/beads-source.json"
              printf '\n````\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
