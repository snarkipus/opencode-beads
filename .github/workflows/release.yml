name: release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Validate vendor content
        run: bun run test:vendor

      - name: Test vendor sync
        run: ./scripts/test-sync-beads.sh

      - name: Test packed package
        run: bun run test:package

      - name: Validate and build release archive
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/release.ts prepare --tag "$RELEASE_TAG" --output release-artifacts

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload release assets to GitHub
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE"

      # npm still needed for trusted publishing, see:
      # https://github.com/oven-sh/bun/issues/15601
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install trusted-publishing capable npm
        # The exact npm release is the validated trusted-publishing client; Bun cannot replace it.
        run: npm install --global npm@11.10.1 # zizmor: ignore[adhoc-packages]

      - name: Publish to npm
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
          # Optional first-publication bootstrap credential. Remove the environment
          # secret after configuring this workflow as the npm trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bun scripts/release.ts verify --archive "$ARCHIVE" --sha256 "$ARCHIVE_SHA256"
          npm publish "$ARCHIVE" --access public
